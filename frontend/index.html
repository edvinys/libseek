<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='./style.css'>
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Login -->
    <div title="login form">
      <h3 class="text-center" style="margin-top:200px">Log in</h3>
      <form class='form-center-width-limit' id="loginForm">
        <div class="mb-3">
          <label for="emailInput" class="form-label">Email address</label>
          <input type="email" class="form-control" id="emailInput" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
          <label for="passwordInput" class="form-label">Password</label>
          <input type="password" class="form-control" id="passwordInput">
        </div>
        <button type="submit" class="btn btn-primary" id="submitButton">Submit</button>
          <p id="loginMessage" style="text-align: center"></p>
      </form>
    </div>
    <script type="module" src="/src/login.ts"></script>
    <!-- Login end -->
  </body>
</html>
